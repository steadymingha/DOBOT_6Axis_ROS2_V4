  <rect width="1420" height="1330" fill="#FAFBFC"/>
  <text x="40" y="40" font-size="20" font-weight="600" fill="#171C24">목표 구조: main.py 로 실물 운전 + 부분 가상화</text>
  <text x="40" y="62" font-size="11.5" fill="#6A7686">초록 태그 = 새로 만들거나 옮길 것 · 나머지는 지금 있는 그대로 · 주황 = 액션을 우회하는 유일한 경로</text>

  <text x="40" y="90" font-size="12" font-weight="650" fill="#0D6E77">① 비전 소스 (택 1 · 같은 토픽)</text>
  <text x="520" y="90" font-size="12" font-weight="650" fill="#0D6E77">② 오케스트레이터 · 계획</text>
  <text x="990" y="90" font-size="12" font-weight="650" fill="#0D6E77">③ 설정 · 명령 · 실물</text>

  <!-- ════ ① 비전 ════ -->
  <rect x="40" y="204" width="180" height="104" rx="4" fill="#F4F6F8" stroke="#8593A2" stroke-width="1.3"/>
  <text x="56" y="230" font-size="12.5" font-weight="650" fill="#3C4654">tag_vision_node</text>
  <text x="56" y="250" font-size="10.5" fill="#8593A2">기존 · 시뮬</text>
  <text x="56" y="272" font-size="10.5" fill="#3C4654">ArUco / AprilTag</text>
  <text x="56" y="292" font-size="10.5" fill="#3C4654">계속 발행 (push)</text>

  <rect x="240" y="204" width="240" height="150" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/>
  <rect x="410" y="214" width="56" height="17" rx="8.5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.9"/>
  <text x="438" y="227" font-size="9.5" fill="#2E7D32" text-anchor="middle">신규</text>
  <text x="256" y="230" font-size="12.5" font-weight="650" fill="#171C24">vision_hover_node</text>
  <text x="256" y="250" font-size="10.5" fill="#6A7686">실물 · shim (약 100줄)</text>
  <text x="256" y="272" font-size="10.5" fill="#3C4654">vision_target 계산 그대로</text>
  <text x="256" y="292" font-size="10.5" fill="#3C4654">vision_bridge 게이트 · 변환</text>
  <text x="256" y="312" font-size="10.5" fill="#3C4654">handeye X (flange↔cam)</text>
  <text x="256" y="336" font-size="10" fill="#2E7D32">hover 를 PoseStamped 로 발행</text>

  <path d="M180,308 V390" fill="none" stroke="#8593A2" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#am)"/>
  <path d="M360,354 V390" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#ag)"/>

  <rect x="140" y="394" width="340" height="56" rx="4" fill="#FFFFFF" stroke="#0D6E77" stroke-width="1.8"/>
  <text x="310" y="418" font-size="12.5" font-weight="650" fill="#0D6E77" text-anchor="middle">/vision/device_pose (PoseStamped)</text>
  <text x="310" y="438" font-size="10" fill="#6A7686" text-anchor="middle">계약 고정 — 받는 쪽은 누가 보냈는지 모른다</text>

  <path d="M478,422 H498 V300 H514" fill="none" stroke="#0D6E77" stroke-width="1.6" marker-end="url(#at)"/>

  <!-- ════ ② 오케스트레이터 ════ -->
  <rect x="520" y="104" width="420" height="72" rx="4" fill="#FFFFFF" stroke="#8593A2" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="540" y="130" font-size="13" font-weight="650" fill="#3C4654">MCS (관제)</text>
  <text x="540" y="152" font-size="10.5" fill="#3C4654">comms/mcs_bridge.py → /mcs/command · /mcs/stop</text>
  <text x="540" y="168" font-size="10" fill="#8593A2">변경 없음</text>

  <path d="M730,176 V200" fill="none" stroke="#8593A2" stroke-width="1.4" marker-end="url(#am)"/>

  <rect x="520" y="204" width="420" height="120" rx="4" fill="#FFFFFF" stroke="#171C24" stroke-width="2"/>
  <text x="540" y="232" font-size="16" font-weight="650" fill="#171C24">main.py</text>
  <text x="540" y="252" font-size="11" fill="#6A7686">미션 디스패처 · REGISTRY 라우팅</text>
  <line x1="540" y1="264" x2="920" y2="264" stroke="#E4EAF0"/>
  <text x="540" y="286" font-size="11" fill="#3C4654">/vision/* 구독 · /vision/capture 발행</text>
  <text x="540" y="308" font-size="11" fill="#2E7D32">비전 교체로 바뀌는 코드 없음 (토픽이 계약)</text>

  <path d="M730,324 V350" fill="none" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="520" y="354" width="420" height="110" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="540" y="382" font-size="15" font-weight="650" fill="#171C24">sequences/</text>
  <text x="540" y="402" font-size="11" fill="#6A7686">wirebonder · shelf — 검증된 시퀀스 로직</text>
  <text x="540" y="424" font-size="11" fill="#3C4654">refresh_device_pose 게이트 (median 15 + spread)</text>
  <text x="540" y="446" font-size="11" fill="#3C4654">그리퍼 · 하강 호출 지점 = 가상화 경계</text>

  <path d="M730,464 V490" fill="none" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="520" y="494" width="420" height="180" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="540" y="522" font-size="15" font-weight="650" fill="#171C24">cr7_pnp.HubPickPlace</text>
  <text x="540" y="542" font-size="11" fill="#6A7686">pinocchio IK · CBiRRT · 액션 클라이언트</text>
  <line x1="540" y1="554" x2="920" y2="554" stroke="#E4EAF0"/>
  <text x="540" y="576" font-size="11" fill="#3C4654">충돌 모델: 선반·재고 팬텀을 상수에서 생성</text>
  <text x="540" y="598" font-size="11" fill="#3C4654">→ 실물 오면 상수만 실측값으로 교체</text>
  <text x="540" y="622" font-size="11" fill="#2E7D32">+ guarded_descend · ContactDetector (테스트에서 이동)</text>
  <text x="540" y="642" font-size="11" fill="#2E7D32">+ collision_env.py — 표면 · 실측 상수 로드</text>
  <text x="540" y="662" font-size="10.5" fill="#B26B00">하강만 액션을 우회한다 (cancel 불가 때문)</text>

  <!-- ════ ③ 설정 · 실행 ════ -->
  <rect x="990" y="204" width="380" height="250" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/>
  <rect x="1300" y="214" width="56" height="17" rx="8.5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.9"/>
  <text x="1328" y="227" font-size="9.5" fill="#2E7D32" text-anchor="middle">신규</text>
  <text x="1006" y="230" font-size="13.5" font-weight="650" fill="#171C24">부분 가상화 스위치</text>
  <text x="1006" y="249" font-size="10.5" fill="#6A7686">main.py 플래그 · 경계 5곳에서만 갈림</text>
  <line x1="1006" y1="260" x2="1354" y2="260" stroke="#E4EAF0"/>
  <text x="1006" y="278" font-size="9.5" font-weight="650" fill="#8593A2">경계</text>
  <text x="1120" y="278" font-size="9.5" font-weight="650" fill="#8593A2">더미</text>
  <text x="1230" y="278" font-size="9.5" font-weight="650" fill="#8593A2">실물</text>
  <text x="1006" y="302" font-size="10" fill="#3C4654">그리퍼</text>
  <text x="1120" y="302" font-size="10" fill="#8593A2">dwell 3초</text>
  <text x="1230" y="302" font-size="10" fill="#3C4654">→ gripper 액션</text>
  <text x="1006" y="328" font-size="10" fill="#3C4654">attach/detach</text>
  <text x="1120" y="328" font-size="10" fill="#8593A2">자동 거부 (현재)</text>
  <text x="1230" y="328" font-size="10" fill="#3C4654">→ 물리 파지</text>
  <text x="1006" y="354" font-size="10" fill="#3C4654">하강</text>
  <text x="1120" y="354" font-size="10" fill="#8593A2">단순 이동</text>
  <text x="1230" y="354" font-size="10" fill="#3C4654">→ 접촉 정지</text>
  <text x="1006" y="380" font-size="10" fill="#3C4654">비전</text>
  <text x="1120" y="380" font-size="10" fill="#8593A2">tag_vision_node</text>
  <text x="1230" y="380" font-size="10" fill="#3C4654">→ vision_hover</text>
  <text x="1006" y="406" font-size="10" fill="#3C4654">충돌 상수</text>
  <text x="1120" y="406" font-size="10" fill="#8593A2">env/sim.json</text>
  <text x="1230" y="406" font-size="10" fill="#3C4654">→ env/real.json</text>
  <text x="1006" y="436" font-size="9.5" fill="#B26B00">충돌 상수만 DOBOT_ENV 로 고른다 (import 시점 확정 — --profile 은 검증만)</text>

  <path d="M986,410 H946" fill="none" stroke="#8593A2" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#am)"/>

  <path d="M944,548 H984" fill="none" stroke="#0D6E77" stroke-width="1.8" marker-end="url(#at)"/>
  <text x="964" y="538" font-size="9.5" fill="#0D6E77" text-anchor="middle">FJT 액션</text>

  <rect x="990" y="494" width="380" height="110" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="1006" y="522" font-size="14" font-weight="650" fill="#171C24">action_move_server</text>
  <text x="1006" y="542" font-size="10.5" fill="#6A7686">dobot_moveit · 변경 없음</text>
  <text x="1006" y="564" font-size="10.5" fill="#3C4654">궤적 → 30 ms 리샘플 → ServoJ</text>
  <text x="1006" y="586" font-size="10.5" fill="#B26B00">cancel 콜백 없음 (진행 중 중단 불가)</text>

  <path d="M1180,604 V650" fill="none" stroke="#0D6E77" stroke-width="1.8" marker-end="url(#at)"/>
  <text x="1192" y="632" font-size="9.5" fill="#0D6E77">ServoJ 서비스</text>

  <path d="M944,654 H962 V709 H984" fill="none" stroke="#B26B00" stroke-width="1.8" marker-end="url(#ao)"/>

  <rect x="990" y="654" width="380" height="110" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="1006" y="682" font-size="14" font-weight="650" fill="#171C24">dobot_bringup_ros2</text>
  <text x="1006" y="702" font-size="10.5" fill="#6A7686">dobot_bringup_v4 · 변경 없음</text>
  <text x="1006" y="724" font-size="10.5" fill="#3C4654">ROS 서비스 ↔ 컨트롤러 TCP</text>
  <text x="1006" y="746" font-size="10.5" fill="#8593A2">29999 명령 · 30004 피드</text>

  <path d="M1180,764 V810" fill="none" stroke="#171C24" stroke-width="1.7" marker-end="url(#a)"/>
  <text x="1192" y="792" font-size="9.5" fill="#6A7686">TCP 29999</text>

  <rect x="990" y="814" width="380" height="90" rx="4" fill="#F2F5F8" stroke="#3C4654" stroke-width="1.5"/>
  <text x="1006" y="844" font-size="14.5" font-weight="650" fill="#171C24">CR7 실물 컨트롤러</text>
  <text x="1006" y="866" font-size="10.5" fill="#6A7686">하드웨어 · 192.168.5.1</text>
  <text x="1006" y="888" font-size="10.5" fill="#3C4654">더미 구간은 그대로, 실물 팔은 진짜로 움직인다</text>

  <!-- ════ robot_feed ════ -->
  <path d="M988,868 H962 V1016 H944" fill="none" stroke="#8593A2" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#am)"/>

  <rect x="40" y="948" width="900" height="140" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/>
  <rect x="870" y="958" width="56" height="17" rx="8.5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.9"/>
  <text x="898" y="971" font-size="9.5" fill="#2E7D32" text-anchor="middle">신규</text>
  <text x="60" y="978" font-size="15" font-weight="650" fill="#171C24">robot_feed — 공용 30004 파서 (읽기 전용)</text>
  <text x="60" y="998" font-size="11" fill="#6A7686">프레임 오프셋 상수의 단일 기준. 명령은 절대 보내지 않는다 (명령은 ServoJ 서비스 쪽이 전담)</text>
  <line x1="60" y1="1010" x2="920" y2="1010" stroke="#E4EAF0"/>
  <text x="60" y="1032" font-size="11" fill="#3C4654">state() → 관절각 · tool_vector · robot_mode · collision   |   torque_window() → 접촉 판정용 토크 히스토리</text>
  <text x="60" y="1054" font-size="11" fill="#3C4654">대체 대상 5벌: RealtimeMonitor(test) · RobotFeed(handeye) · read_feedback · check_real_robot · jog_tcp</text>
  <text x="60" y="1076" font-size="10.5" fill="#2E7D32">인터페이스는 이미 RealtimeMonitor 가 정해 놨다 — 옮기기만 하면 되고 새 API 없음</text>

  <path d="M90,946 V320 H236" fill="none" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="100" y="312" font-size="9.5" fill="#2E7D32">tool_vector</text>

  <path d="M700,946 V678" fill="none" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="712" y="742" font-size="9.5" fill="#2E7D32">접촉 판정 (m_actual)</text>
  <text x="712" y="760" font-size="9.5" fill="#2E7D32">정지 판정 · 보호정지 감지</text>

  <rect x="990" y="948" width="380" height="140" rx="4" fill="#F4F6F8" stroke="#8593A2" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1006" y="976" font-size="13" font-weight="650" fill="#3C4654">시뮬 경로 (그대로 유지)</text>
  <text x="1006" y="998" font-size="10.5" fill="#3C4654">같은 액션 이름을 gazebo_ros2_control 이 연다</text>
  <text x="1006" y="1020" font-size="10.5" fill="#3C4654">/joint_states 는 joint_state_broadcaster 가 발행</text>
  <text x="1006" y="1042" font-size="10.5" fill="#3C4654">30004 가 없으므로 robot_feed 미사용</text>
  <text x="1006" y="1066" font-size="10" fill="#8593A2">시뮬/실물 전환은 여전히 액션 이름 하나로 성립</text>

  <text x="40" y="1312" font-size="10.5" fill="#8593A2">새로 만드는 것은 vision_hover_node · robot_feed · 가상화 스위치 · collision_env / teach_env / env json. 나머지는 테스트 파일에서 꺼내 옮기는 작업이고, main.py 와 sequences/ 의 검증된 로직은 건드리지 않는다.</text>

  <!-- ════ 충돌 환경 ════ -->
  <text x="40" y="1146" font-size="12" font-weight="650" fill="#0D6E77">④ 충돌 환경 — 교시(1회, 사람) 와 적용(기동 시, 자동) 을 가른다</text>

  <rect x="40" y="1160" width="420" height="130" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/>
  <rect x="390" y="1170" width="56" height="17" rx="8.5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.9"/>
  <text x="418" y="1183" font-size="9.5" fill="#2E7D32" text-anchor="middle">신규</text>
  <text x="60" y="1188" font-size="14" font-weight="650" fill="#171C24">tools/teach_env.py</text>
  <text x="60" y="1208" font-size="10.5" fill="#6A7686">셋업 시 1회 · 사람이 실행 · 팔이 움직인다</text>
  <text x="60" y="1230" font-size="10.5" fill="#3C4654">--teach-surface z- : 툴을 대고 접촉으로 측정</text>
  <text x="60" y="1250" font-size="10.5" fill="#3C4654">--set-surface x+ --at : 숫자로 지정 (로봇 불필요)</text>
  <text x="60" y="1272" font-size="10.5" fill="#2E7D32">→ surfaces.json</text>

  <path d="M462,1225 H514" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#ag)"/>

  <rect x="520" y="1160" width="420" height="130" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/>
  <rect x="870" y="1170" width="56" height="17" rx="8.5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.9"/>
  <text x="898" y="1183" font-size="9.5" fill="#2E7D32" text-anchor="middle">신규</text>
  <text x="540" y="1188" font-size="14" font-weight="650" fill="#171C24">cr7_pnp/collision_env.py</text>
  <text x="540" y="1208" font-size="10.5" fill="#6A7686">main.py 기동 시 자동 · 팔은 안 움직인다</text>
  <text x="540" y="1230" font-size="10.5" fill="#3C4654">surfaces.json 을 읽어 슬래브 등록</text>
  <text x="540" y="1250" font-size="10.5" fill="#3C4654">선반 판 · 재고 팬텀은 node.py 가 이미 생성</text>
  <text x="540" y="1272" font-size="10.5" fill="#B26B00">등록 실패 시 경고가 아니라 중단 (fail-closed)</text>

  <path d="M962,1225 H984" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#ag)"/>

  <rect x="990" y="1160" width="380" height="130" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/>
  <rect x="1300" y="1170" width="56" height="17" rx="8.5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.9"/>
  <text x="1328" y="1183" font-size="9.5" fill="#2E7D32" text-anchor="middle">신규</text>
  <text x="1006" y="1188" font-size="14" font-weight="650" fill="#171C24">cr7_pnp/env/{sim,real}.json</text>
  <text x="1006" y="1208" font-size="10.5" fill="#6A7686">DOBOT_ENV 로 하나를 로드</text>
  <text x="1006" y="1230" font-size="10.5" fill="#3C4654">선반 · 포켓 · 박스 치수 실측값</text>
  <text x="1006" y="1250" font-size="10.5" fill="#3C4654">geometry.py 가 같은 상수명을 채움</text>
