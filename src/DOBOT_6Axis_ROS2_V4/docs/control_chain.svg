<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1020" width="1300" height="1020"
     font-family="system-ui, -apple-system, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#171C24"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D6E77"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8593A2"/>
    </marker>
  </defs>

  <rect width="1300" height="1020" fill="#FAFBFC"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#171C24">CR7 명령 흐름 · 패키지 구성 (실물 / 시뮬)</text>

  <!-- ── MCS ── -->
  <rect x="40" y="86" width="250" height="88" rx="4" fill="#FFFFFF" stroke="#8593A2" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="58" y="114" font-size="14.5" font-weight="650" fill="#3C4654">MCS (관제)</text>
  <text x="58" y="135" font-size="11.5" fill="#6A7686">comms/mcs_bridge.py 가 수신</text>
  <text x="58" y="156" font-size="11.5" fill="#3C4654">TCP 15B 프레임 → ROS 토픽</text>

  <line x1="290" y1="130" x2="440" y2="130" stroke="#8593A2" stroke-width="1.4" marker-end="url(#am)"/>
  <text x="365" y="118" font-size="10.5" fill="#6A7686" text-anchor="middle">/mcs/command</text>
  <text x="365" y="148" font-size="10.5" fill="#8593A2" text-anchor="middle">/mcs/stop</text>

  <!-- ── main.py ── -->
  <rect x="445" y="86" width="300" height="88" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="465" y="115" font-size="16" font-weight="650" fill="#171C24">main.py</text>
  <text x="465" y="136" font-size="11.5" fill="#6A7686">패키지 루트 src/DOBOT_6Axis_ROS2_V4/</text>
  <text x="465" y="158" font-size="11.5" fill="#3C4654">REGISTRY 라우팅 · sequences/ 실행</text>

  <!-- ── 비전 ── -->
  <rect x="40" y="212" width="250" height="104" rx="4" fill="#FFFFFF" stroke="#8593A2" stroke-width="1.4"/>
  <text x="58" y="240" font-size="14.5" font-weight="650" fill="#3C4654">tag_vision_node</text>
  <text x="58" y="261" font-size="11.5" fill="#6A7686">vision/ · 별도 프로세스</text>
  <text x="58" y="283" font-size="11.5" fill="#3C4654">ArUco/AprilTag 자세추정</text>
  <text x="58" y="304" font-size="11.5" fill="#3C4654">vision_bridge/ 로 base 좌표 변환</text>

  <path d="M290,240 H520 V178" fill="none" stroke="#8593A2" stroke-width="1.4" marker-end="url(#am)"/>
  <text x="404" y="232" font-size="10.5" fill="#6A7686" text-anchor="middle">/vision/device_pose · /vision/shelf_pose</text>
  <text x="404" y="258" font-size="10" fill="#8593A2" text-anchor="middle">(main.py → /vision/capture 로 촬영 요청)</text>

  <line x1="595" y1="174" x2="595" y2="326" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="607" y="206" font-size="10.5" fill="#6A7686">파이썬 직접 호출</text>
  <text x="607" y="224" font-size="10.5" fill="#8593A2">(블로킹 FSM · MoveIt 경유 아님)</text>

  <!-- ── cr7_pnp ── -->
  <rect x="445" y="330" width="300" height="124" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="465" y="359" font-size="16" font-weight="650" fill="#171C24">cr7_pnp.HubPickPlace</text>
  <text x="465" y="379" font-size="11.5" fill="#6A7686">노드: cr7_rrt_planner</text>
  <line x1="465" y1="392" x2="725" y2="392" stroke="#E4EAF0"/>
  <text x="465" y="412" font-size="11.5" fill="#3C4654">pinocchio IK · 충돌검사 (cra_description xacro)</text>
  <text x="465" y="431" font-size="11.5" fill="#3C4654">CBiRRT 경로계획</text>
  <text x="465" y="448" font-size="11.5" font-weight="650" fill="#0D6E77">FollowJointTrajectory 액션 클라이언트</text>

  <!-- ── move_group (미사용) ── -->
  <rect x="880" y="360" width="300" height="110" rx="4" fill="#F4F6F8" stroke="#8593A2" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="900" y="388" font-size="15" font-weight="650" fill="#8593A2">move_group</text>
  <text x="900" y="408" font-size="11.5" fill="#8593A2">패키지: cr7_moveit (SRDF · IK · 컨트롤러 매핑)</text>
  <text x="900" y="430" font-size="11.5" fill="#8593A2">RViz 수동 계획·실행용</text>
  <text x="900" y="452" font-size="11.5" font-weight="650" fill="#8593A2">main.py 자동 운전 경로에서는 미사용</text>

  <path d="M1030,470 V507 H819" fill="none" stroke="#8593A2" stroke-width="1.2"
        stroke-dasharray="5 4" marker-end="url(#am)"/>

  <line x1="595" y1="454" x2="595" y2="474" stroke="#0D6E77" stroke-width="1.9" marker-end="url(#at)"/>

  <!-- ── 공통 접점 ── -->
  <rect x="375" y="478" width="440" height="76" rx="4" fill="#FFFFFF" stroke="#0D6E77" stroke-width="1.9"/>
  <text x="595" y="503" font-size="13" font-weight="650" fill="#0D6E77" text-anchor="middle">/cr7_group_controller/follow_joint_trajectory</text>
  <text x="595" y="524" font-size="10.5" fill="#6A7686" text-anchor="middle">실물·시뮬 공통 접점 — 이 액션을 누가 여느냐만 다름</text>
  <text x="595" y="544" font-size="10.5" fill="#B26B00" text-anchor="middle">그리퍼는 /gripper_controller/… — 시뮬만 존재, 실물 서버 없음 (확인 필요)</text>

  <!-- ── fork ── -->
  <path d="M595,554 V574 H270 V596" fill="none" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M595,554 V574 H950 V596" fill="none" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="284" y="590" font-size="12.5" font-weight="650" fill="#171C24">실물</text>
  <text x="964" y="590" font-size="12.5" font-weight="650" fill="#171C24">시뮬 (Gazebo)</text>

  <!-- ── 실물 L1 ── -->
  <rect x="90" y="600" width="360" height="106" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="110" y="629" font-size="15.5" font-weight="650" fill="#171C24">action_move_server</text>
  <text x="110" y="649" font-size="11.5" font-weight="650" fill="#0D6E77">패키지: dobot_moveit</text>
  <text x="110" y="671" font-size="11.5" fill="#3C4654">액션 서버를 직접 띄움 (노드)</text>
  <text x="110" y="692" font-size="11.5" fill="#3C4654">궤적을 30 ms 그리드로 리샘플</text>

  <line x1="270" y1="706" x2="270" y2="752" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="282" y="726" font-size="10.5" fill="#6A7686">/dobot_bringup_ros2/srv/ServoJ</text>
  <text x="282" y="744" font-size="10.5" fill="#8593A2">33 Hz 스트리밍</text>

  <!-- ── 실물 L2 ── -->
  <rect x="90" y="752" width="360" height="96" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="110" y="781" font-size="15.5" font-weight="650" fill="#171C24">dobot_bringup_ros2</text>
  <text x="110" y="801" font-size="11.5" font-weight="650" fill="#0D6E77">패키지: dobot_bringup_v4 (cr_robot_ros2)</text>
  <text x="110" y="824" font-size="11.5" fill="#3C4654">ROS 서비스 ↔ 컨트롤러 TCP 변환</text>

  <line x1="270" y1="848" x2="270" y2="894" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="282" y="868" font-size="10.5" fill="#6A7686">TCP 29999 (대시보드)</text>
  <text x="282" y="886" font-size="10.5" fill="#8593A2">30004 (실시간 피드백)</text>

  <rect x="90" y="894" width="360" height="62" rx="4" fill="#F2F5F8" stroke="#3C4654" stroke-width="1.4"/>
  <text x="110" y="922" font-size="15" font-weight="650" fill="#171C24">CR7 실물 컨트롤러</text>
  <text x="110" y="943" font-size="11.5" fill="#6A7686">하드웨어</text>

  <!-- ── 시뮬 R1 ── -->
  <rect x="770" y="600" width="360" height="106" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="790" y="629" font-size="15.5" font-weight="650" fill="#171C24">cr7_group_controller</text>
  <text x="790" y="649" font-size="11.5" fill="#6A7686">joint_trajectory_controller (ros2_control)</text>
  <text x="790" y="671" font-size="11.5" font-weight="650" fill="#0D6E77">설정: cr7_moveit/config/ros2_controllers.yaml</text>
  <text x="790" y="692" font-size="11.5" fill="#3C4654">액션 서버가 컨트롤러 안에 내장</text>

  <line x1="950" y1="706" x2="950" y2="752" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="962" y="733" font-size="10.5" fill="#6A7686">position 명령</text>

  <!-- ── 시뮬 R2 ── -->
  <rect x="770" y="752" width="360" height="96" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="790" y="781" font-size="15.5" font-weight="650" fill="#171C24">gazebo_ros2_control</text>
  <text x="790" y="801" font-size="11.5" fill="#6A7686">Gazebo 프로세스 내 controller_manager (노드 아님)</text>
  <text x="790" y="824" font-size="11.5" fill="#3C4654">플러그인 선언: cra_description URDF</text>

  <line x1="950" y1="848" x2="950" y2="894" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="962" y="875" font-size="10.5" fill="#6A7686">GazeboSystem 하드웨어 인터페이스</text>

  <rect x="770" y="894" width="360" height="62" rx="4" fill="#F2F5F8" stroke="#3C4654" stroke-width="1.4"/>
  <text x="790" y="922" font-size="15" font-weight="650" fill="#171C24">Gazebo CR7 모델</text>
  <text x="790" y="943" font-size="11.5" fill="#6A7686">기동: dobot_gazebo · worlds/cr.world</text>

  <!-- ── 상태 되먹임 (실물) ── -->
  <path d="M90,790 H50 V384 H441" fill="none" stroke="#8593A2" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#am)"/>
  <text x="66" y="358" font-size="10.5" fill="#6A7686">/joint_states_robot → joint_states 노드 (dobot_moveit)</text>
  <text x="66" y="374" font-size="10.5" fill="#6A7686">→ /joint_states</text>

  <!-- ── 상태 되먹임 (시뮬) ── -->
  <path d="M1130,790 H1255 V340 H749" fill="none" stroke="#8593A2" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#am)"/>
  <text x="1240" y="314" font-size="10.5" fill="#6A7686" text-anchor="end">joint_state_broadcaster</text>
  <text x="1240" y="330" font-size="10.5" fill="#6A7686" text-anchor="end">→ /joint_states</text>

  <text x="40" y="986" font-size="10.5" fill="#8593A2">cr7_pnp 는 액션 이름을 /cr7_group_controller/… 로 하드코딩 · action_move_server 는 DOBOT_TYPE 환경변수로 조립 — 둘이 어긋나면 액션이 연결되지 않음</text>
  <text x="40" y="1004" font-size="10.5" fill="#8593A2">cr7_pnp 는 cra_description xacro + cr7_moveit 의 SRDF 를 파일로 직접 읽음 — move_group 프로세스 없이 동작</text>
</svg>
