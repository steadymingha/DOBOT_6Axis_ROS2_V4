  <text x="826" y="300" font-size="9.5" fill="#6A7686">30004</text>

  <text x="40" y="576" font-size="10.5" fill="#8593A2">--run 이 붙어야 실제로 모터가 돈다 (실행 전 y/N 확인). --vision 만 주면 계획·검증까지만 하고 끝난다.</text>
