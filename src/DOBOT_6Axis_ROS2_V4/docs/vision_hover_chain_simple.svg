  </defs>

  <rect width="1240" height="620" fill="#FAFBFC"/>
  <text x="40" y="44" font-size="19" font-weight="600" fill="#171C24">cbirrt_p1p2_test.py --vision --run · 모듈 한눈에</text>
  <text x="40" y="66" font-size="11" fill="#6A7686">주황 태그 = 사전에 따로 띄워 둬야 하는 프로세스 · 점선 = 파일 / 읽기 전용</text>

