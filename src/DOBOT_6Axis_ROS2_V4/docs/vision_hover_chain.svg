  <text x="1070" y="418" font-size="15.5" font-weight="650" fill="#171C24">action_move_server</text>
  <text x="1070" y="438" font-size="11" fill="#6A7686">패키지 dobot_moveit (dobot_joint.launch.py)</text>
  <line x1="1070" y1="450" x2="1420" y2="450" stroke="#E4EAF0"/>
  <text x="1070" y="470" font-size="11.5" fill="#3C4654">FJT 액션 서버 · 궤적을 30 ms 그리드로 리샘플</text>
  <text x="1070" y="492" font-size="11.5" fill="#3C4654">joint_states 노드 — /joint_states_robot → /joint_states</text>
  <text x="1070" y="512" font-size="10.5" fill="#B26B00">cancel 콜백 없음 — 진행 중 goal 은 중단 불가</text>

  <path d="M1280,520 V576" fill="none" stroke="#0D6E77" stroke-width="1.8" marker-end="url(#at)"/>
  <text x="1292" y="542" font-size="10" fill="#0D6E77">srv/ServoJ · 33 Hz</text>
  <text x="1292" y="560" font-size="9.5" fill="#8593A2">"t 안에 도달하고 유지"</text>

  <rect x="1050" y="580" width="460" height="130" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <rect x="1432" y="592" width="64" height="18" rx="9" fill="#FFF3E0" stroke="#B26B00" stroke-width="0.9"/>
  <text x="1464" y="605" font-size="9.5" fill="#B26B00" text-anchor="middle">사전 실행</text>
  <text x="1070" y="608" font-size="15.5" font-weight="650" fill="#171C24">dobot_bringup_ros2</text>
  <text x="1070" y="628" font-size="11" fill="#6A7686">패키지 dobot_bringup_v4 (cr_robot_ros2)</text>
  <line x1="1070" y1="640" x2="1420" y2="640" stroke="#E4EAF0"/>
  <text x="1070" y="660" font-size="11.5" fill="#3C4654">ROS 서비스 ↔ 컨트롤러 TCP 변환</text>
  <text x="1070" y="682" font-size="11.5" fill="#3C4654">EnableRobot · ServoJ · SpeedFactor · ClearError</text>
  <text x="1070" y="702" font-size="10.5" fill="#8593A2">29999 대시보드 · 30004 실시간 피드</text>

  <path d="M1280,710 V766" fill="none" stroke="#171C24" stroke-width="1.7" marker-end="url(#a)"/>
  <text x="1292" y="742" font-size="10" fill="#6A7686">TCP 29999</text>

  <rect x="1050" y="770" width="460" height="90" rx="4" fill="#F2F5F8" stroke="#3C4654" stroke-width="1.5"/>
  <text x="1070" y="800" font-size="15.5" font-weight="650" fill="#171C24">CR7 실물 컨트롤러</text>
  <text x="1070" y="822" font-size="11" fill="#6A7686">하드웨어 · 192.168.5.1</text>
  <text x="1070" y="844" font-size="10.5" fill="#3C4654">하강은 기본 동작 — 접촉 정지 후 측정한 만큼 되올림 (--no-descend 로 생략)</text>

  <!-- ── 30004 되먹임 ── -->
  <path d="M1048,815 H1000 V585 H602 V564" fill="none" stroke="#8593A2" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#am)"/>
  <text x="800" y="578" font-size="10" fill="#6A7686" text-anchor="middle">30004 실시간 피드 (읽기 전용 · 명령 아님)</text>

  <text x="40" y="908" font-size="10.5" fill="#8593A2">주황 태그 = 이 스크립트를 돌리기 전에 따로 띄워 둬야 하는 프로세스 · 청록 화살표 = 이 모드에서 실제로 오가는 데이터 · 점선 = 읽기 전용 / 파일</text>
  <text x="40" y="926" font-size="10.5" fill="#8593A2">--run 이 붙어야 ①②⑤ 구간에서 실제로 모터가 돈다 (실행 전 y/N 확인 프롬프트). --run 없이 --vision 만 주면 ③④ 까지의 계획·검증만 하고 끝난다</text>
</svg>
