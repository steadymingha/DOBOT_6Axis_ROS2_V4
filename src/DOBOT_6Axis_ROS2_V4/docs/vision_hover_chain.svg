  <text x="1292" y="370" font-size="9.5" fill="#8593A2">/cr7_group_controller/…</text>

  <path d="M1440,386 V334" fill="none" stroke="#8593A2" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#am)"/>
