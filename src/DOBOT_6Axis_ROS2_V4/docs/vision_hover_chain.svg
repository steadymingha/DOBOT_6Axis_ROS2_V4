  <text x="441" y="244" font-size="9.5" fill="#8593A2" text-anchor="middle">거부 시 예외</text>

  <!-- ════════ 열 ②↔③ ════════ -->
  <line x1="952" y1="170" x2="1046" y2="170" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>
