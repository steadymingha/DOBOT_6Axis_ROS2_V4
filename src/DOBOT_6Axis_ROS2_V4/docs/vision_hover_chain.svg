  <!-- ════════ 열 ③ ════════ -->
  <rect x="1050" y="120" width="460" height="210" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="1070" y="150" font-size="15.5" font-weight="650" fill="#171C24">cr7_pnp.HubPickPlace</text>
  <text x="1070" y="170" font-size="11" fill="#6A7686">노드 cr7_rrt_planner · move_group 안 씀</text>
  <line x1="1070" y1="182" x2="1490" y2="182" stroke="#E4EAF0"/>
  <text x="1070" y="204" font-size="11.5" fill="#3C4654">cbirrt.py — 툴 자세 구속 CBiRRT</text>
  <text x="1070" y="226" font-size="11.5" fill="#3C4654">model.py — pinocchio FK/IK · 자기충돌 (SRDF)</text>
  <text x="1070" y="248" font-size="11.5" fill="#3C4654">geometry.py — xacro 경로 · TCP 오프셋</text>
  <text x="1070" y="270" font-size="11.5" fill="#3C4654">execute_path · capture (경로 기록)</text>
  <line x1="1070" y1="284" x2="1490" y2="284" stroke="#E4EAF0"/>
  <text x="1070" y="304" font-size="10.5" fill="#8593A2">모델: cra_description xacro (팔 단독 + 팔·큐브·AGV 결합)</text>
  <text x="1070" y="322" font-size="10.5" fill="#8593A2">SRDF: cr7_moveit/config/cr7_robot.srdf (파일로 직접 읽음)</text>

