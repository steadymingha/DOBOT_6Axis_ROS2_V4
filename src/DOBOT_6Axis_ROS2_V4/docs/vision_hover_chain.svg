  <line x1="488" y1="170" x2="394" y2="170" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="441" y="158" font-size="10" fill="#6A7686" text-anchor="middle">acquire_hover_q()</text>
  <line x1="394" y1="224" x2="488" y2="224" stroke="#0D6E77" stroke-width="1.6" marker-end="url(#at)"/>
