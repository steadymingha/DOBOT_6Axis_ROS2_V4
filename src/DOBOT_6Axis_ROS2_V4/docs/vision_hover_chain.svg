  <text x="743" y="447" font-size="13.5" font-weight="650" fill="#171C24">Dashboard</text>
  <text x="743" y="466" font-size="10.5" fill="#B26B00">이동 전 1회 · --run 에서만</text>
  <text x="743" y="488" font-size="10.5" fill="#3C4654">SpeedFactor</text>
  <text x="743" y="508" font-size="10.5" fill="#3C4654">충돌 레벨 (touch-off)</text>
  <text x="743" y="528" font-size="10.5" fill="#3C4654">ClearError</text>
  <text x="743" y="548" font-size="10.5" fill="#8593A2">29999 대시보드 서비스</text>

  <path d="M720,608 V386" fill="none" stroke="#8593A2" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#am)"/>

  <rect x="490" y="610" width="460" height="120" rx="4" fill="#F4F6F8" stroke="#8593A2" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="510" y="638" font-size="13.5" font-weight="650" fill="#3C4654">교시 데이터 · 결과 파일</text>
  <text x="510" y="660" font-size="10.5" fill="#3C4654">test/points.json — obs 자세 (교시된 관절각)</text>
  <text x="510" y="680" font-size="10.5" fill="#3C4654">test/surfaces.json — 테이블·벽 반평면 → 충돌 모델 등록</text>
  <text x="510" y="702" font-size="10.5" fill="#3C4654">test/vision_hover_&lt;시각&gt;.json — 실행 결과 기록</text>
  <text x="510" y="722" font-size="10.5" fill="#8593A2">obs 가 없으면 --vision 은 시작조차 하지 않음</text>

