  <rect width="1560" height="940" fill="#FAFBFC"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#171C24">cbirrt_p1p2_test.py --vision --run · 모듈 구성과 주고받는 것</text>
  <text x="40" y="68" font-size="11.5" fill="#6A7686">실행: test/run.sh → docker exec ros2_dobot → /root/dobot_ws/.venv/bin/python3 test/cbirrt_p1p2_test.py --vision --run</text>

  <text x="50" y="102" font-size="12.5" font-weight="650" fill="#0D6E77">① 비전 계산 · 체인</text>
  <text x="490" y="102" font-size="12.5" font-weight="650" fill="#0D6E77">② 오케스트레이터 · 상태 감시</text>
  <text x="1050" y="102" font-size="12.5" font-weight="650" fill="#0D6E77">③ 계획 → 명령 → 실물</text>

  <!-- ════════ 열 ① ════════ -->
  <rect x="50" y="120" width="340" height="200" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="68" y="148" font-size="15" font-weight="650" fill="#171C24">test/vision_target.py</text>
  <text x="68" y="168" font-size="11" fill="#6A7686">계산 전담 · 로봇에 명령 안 보냄</text>
  <line x1="68" y1="180" x2="372" y2="180" stroke="#E4EAF0"/>
  <text x="68" y="200" font-size="11" fill="#3C4654">snapshot() — 러너 MAGAZINE → IDLE</text>
  <text x="68" y="220" font-size="11" fill="#3C4654">acquire_hover_q() — P_base → hover → IK q</text>
  <text x="68" y="240" font-size="11" fill="#3C4654">coarse / pick_target / viewpoint_q (--target)</text>
  <text x="68" y="262" font-size="11" fill="#3C4654">상수: 매거진 140 · 여유 80 · 안쪽 118 mm</text>
  <text x="68" y="284" font-size="10.5" fill="#8593A2">tool_vector 는 mon(30004) 에서 받음</text>
  <text x="68" y="304" font-size="10.5" fill="#8593A2">플랜지 원점 기준 · 팬텀 그리퍼 오프셋 상쇄</text>

  <path d="M290,320 V376" fill="none" stroke="#171C24" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="302" y="342" font-size="10" fill="#6A7686">import</text>
  <text x="302" y="360" font-size="10" fill="#8593A2">게이트·변환 재사용</text>

  <rect x="50" y="380" width="340" height="200" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <text x="68" y="408" font-size="15" font-weight="650" fill="#171C24">vision_bridge/</text>
  <text x="68" y="428" font-size="11" fill="#6A7686">컨테이너 · 좌표 변환 + 채택 검증</text>
  <line x1="68" y1="440" x2="372" y2="440" stroke="#E4EAF0"/>
  <text x="68" y="460" font-size="11" fill="#3C4654">vision_client.py — ZMQ SUB(CONFLATE) / REQ</text>
  <text x="68" y="482" font-size="11" fill="#3C4654">gate.py — 통과 10프레임 평균 = 스냅샷</text>
  <text x="68" y="504" font-size="11" fill="#3C4654">transform.py — P_base = tool_to_T · X · P_cam</text>
  <text x="68" y="526" font-size="11" fill="#3C4654">config.py — 포트 · 게이트 임계값 · 로봇 IP</text>
  <text x="68" y="552" font-size="10.5" fill="#B26B00">로봇에 아무것도 안 보냄 (30004 읽기 전용)</text>

  <path d="M145,608 V582" fill="none" stroke="#8593A2" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#am)"/>
  <rect x="50" y="610" width="190" height="90" rx="4" fill="#F4F6F8" stroke="#8593A2" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="66" y="636" font-size="12.5" font-weight="650" fill="#3C4654">handeye_calib/</text>
  <text x="66" y="656" font-size="10.5" fill="#6A7686">handeye_result.json</text>
  <text x="66" y="676" font-size="10.5" fill="#3C4654">X (flange↔cam)</text>
  <text x="66" y="692" font-size="10.5" fill="#3C4654">tool_to_T · STILL_DPS</text>

  <path d="M290,582 V736" fill="none" stroke="#0D6E77" stroke-width="1.8"
        marker-start="url(#at)" marker-end="url(#at)"/>
  <text x="302" y="638" font-size="10" fill="#0D6E77">↑ SUB 5555 검출결과</text>
  <text x="302" y="656" font-size="10" fill="#0D6E77">↓ REQ 5556 set_mode·ping</text>
  <text x="302" y="676" font-size="9.5" fill="#8593A2">msgpack · 127.0.0.1</text>

  <rect x="50" y="740" width="340" height="130" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.7"/>
  <rect x="312" y="752" width="64" height="18" rx="9" fill="#FFF3E0" stroke="#B26B00" stroke-width="0.9"/>
  <text x="344" y="765" font-size="9.5" fill="#B26B00" text-anchor="middle">사전 실행</text>
  <text x="68" y="768" font-size="15" font-weight="650" fill="#171C24">vision_runner</text>
  <text x="68" y="788" font-size="11" fill="#6A7686">Jetson 호스트 · 저장소 밖 (~/robot_vision)</text>
  <line x1="68" y1="800" x2="372" y2="800" stroke="#E4EAF0"/>
  <text x="68" y="820" font-size="11" fill="#3C4654">D405 카메라 단독 소유 (V4L2 배타)</text>
  <text x="68" y="842" font-size="11" fill="#3C4654">YOLOX 매거진 검출 + depth → xyz_cam</text>
  <text x="68" y="860" font-size="10.5" fill="#8593A2">10초간 커맨드 없으면 IDLE 로 강등</text>

  <!-- ════════ 열 ② ════════ -->
  <rect x="490" y="120" width="460" height="260" rx="4" fill="#FFFFFF" stroke="#171C24" stroke-width="2"/>
  <text x="510" y="150" font-size="16" font-weight="650" fill="#171C24">test/cbirrt_p1p2_test.py — run_vision()</text>
  <text x="510" y="170" font-size="11" fill="#6A7686">컨테이너 ros2_dobot · pinocchio venv · 오케스트레이터</text>
  <line x1="510" y1="182" x2="930" y2="182" stroke="#E4EAF0"/>
  <text x="510" y="204" font-size="11.5" fill="#3C4654">① obs 자세로 CBiRRT 이동 (자유 RRT 폴백 거부)</text>
  <text x="510" y="226" font-size="11.5" fill="#3C4654">② --target 시 개략 검출 → 근접 관측 자세</text>
  <text x="510" y="248" font-size="11.5" fill="#3C4654">③ 정지 확인 → 비전 스냅샷 → hover → q</text>
  <text x="510" y="270" font-size="11.5" fill="#3C4654">④ 툴 기울기 검사 — 한도 초과 시 거부</text>
  <text x="510" y="292" font-size="11.5" fill="#3C4654">⑤ --run: hover → J6 정렬 → 접촉 정지 하강 → 역재생 복귀</text>
  <line x1="510" y1="306" x2="930" y2="306" stroke="#E4EAF0"/>
  <text x="510" y="328" font-size="10.5" fill="#8593A2">carry() 는 CBiRRT 전용 · retrace() 는 기록 경로 역재생</text>
  <text x="510" y="346" font-size="10.5" fill="#8593A2">tilt_gap() · settled() · arrived() · load_points()</text>
  <text x="510" y="368" font-size="10.5" fill="#B26B00">--run 을 빼면 ③④ 까지만 하고 종료 (로봇 정지)</text>

  <path d="M580,418 V384" fill="none" stroke="#171C24" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="592" y="404" font-size="9.5" fill="#6A7686">관절각 · tool_vector · 정지 · 충돌</text>

  <rect x="490" y="420" width="225" height="140" rx="4" fill="#FFFFFF" stroke="#3C4654" stroke-width="1.5"/>
  <text x="508" y="447" font-size="13.5" font-weight="650" fill="#171C24">RealtimeMonitor</text>
  <text x="508" y="466" font-size="10.5" fill="#6A7686">스레드 · 읽기 전용</text>
  <text x="508" y="488" font-size="10.5" fill="#3C4654">30004 실시간 피드 125 Hz</text>
  <text x="508" y="508" font-size="10.5" fill="#3C4654">관절각 · tool_vector</text>
  <text x="508" y="528" font-size="10.5" fill="#3C4654">정지 판정 (STILL_DPS)</text>
